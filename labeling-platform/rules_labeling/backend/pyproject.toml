[project]
name = "rules-labeling-backend"
version = "0.1.0"
description = "FastAPI backend for labeling extracted and classified rules."
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.2",
    "fastapi>=0.124.0",
    "pydantic>=2.0.0",
    "rules-models",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[project.scripts]
rules-labeling-api = "rules_labeling_backend.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules_labeling_backend"]

[tool.uv.sources]
rules-models = { path = "../../rules_models", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
