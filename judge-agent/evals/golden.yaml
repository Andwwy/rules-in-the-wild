# Hand-curated ground truth for the judge. 15 rules covering common patterns
# from each axis. The expected values are the author's best calls, not gospel —
# the goal is "judge agrees with a reasonable human" not "judge nails this
# exact taxonomy interpretation."
#
# Once the labeling UI has accumulated ~50+ accepted classifications, regenerate
# this file from classification_labels (decision='accept').

- rule_text: "Always run `cargo test` before committing."
  source_kind: claude_md
  expected:
    rule_specificity: stack_specific
    rule_cognitive_load: requires_running_cmd
    rule_constraint_level: human_workflow
    enforcement_mechanism: deterministic
    enforcement_scope: local
    enforcement_trigger: pre_tool_verify_gate
    rule_kind: process_sequential
    artifacts_required: [tool_call_log]

- rule_text: "Think step by step before writing code."
  source_kind: cursor_rules
  expected:
    rule_specificity: universal
    rule_cognitive_load: zero_lookup
    rule_constraint_level: planning_reasoning
    enforcement_mechanism: llm_judge
    enforcement_scope: runtime_external
    enforcement_trigger: intermediate_output
    rule_kind: process_agent_response
    artifacts_required: [reasoning_trace]

