<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is-rule annotator</title>
<style>
  :root {
    --bg: #fbfbfa;
    --panel: #fff;
    --line: #e3e3e0;
    --text: #1c1c1a;
    --muted: #75756e;
    --yes: #2f7d4f;
    --no: #b4483c;
    --accent: #2b5fd9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .progress { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .bar { flex: 0 0 200px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- sidebar ---- */
  #list {
    flex: 0 0 340px; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel);
  }
  .item {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 7px 10px; border-bottom: 1px solid #f0f0ee; cursor: pointer;
  }
  .item:hover { background: #f5f5f3; }
  .item.sel { background: #eaf0fd; box-shadow: inset 3px 0 0 var(--accent); }
  .item .n { flex: 0 0 34px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .item .t {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: #33332f;
  }
  /* modifier names are prefixed: a bare .n would collide with .item .n above */
  .dot { flex: 0 0 8px; height: 8px; width: 8px; border-radius: 50%; background: var(--line); margin-top: 5px; }
  .dot.is-y { background: var(--yes); }
  .dot.is-n { background: var(--no); }

  /* ---- detail ---- */
  #detail { flex: 1; overflow-y: auto; padding: 28px 32px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .meta { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .meta code { font-size: 11px; }
  .meta a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta a:hover { text-decoration: underline; }
  /* rendered markdown */
  .clause {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px 22px; margin-bottom: 10px; font-size: 15px; line-height: 1.7;
    word-break: break-word;
  }
  .clause > :first-child { margin-top: 0; }
  .clause > :last-child { margin-bottom: 0; }
  .clause p { margin: 6px 0; }
  .clause h1, .clause h2, .clause h3, .clause h4, .clause h5, .clause h6 {
    font-size: 15px; font-weight: 600; margin: 0 0 6px;
  }
  .clause ul, .clause ol { margin: 4px 0; padding-left: 22px; }
  .clause li { margin: 2px 0; }
  .clause li input[type="checkbox"] { margin-right: 6px; }
  .clause code {
    font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f1f1ee; padding: 1px 5px; border-radius: 4px;
  }
  .clause pre {
    background: #f7f7f5; border: 1px solid var(--line); border-radius: 5px;
    padding: 10px 12px; margin: 8px 0; overflow-x: auto;
  }
  .clause pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }
  .clause blockquote {
    margin: 6px 0; padding-left: 12px;
    border-left: 3px solid var(--line); color: var(--muted);
  }
  .clause table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  .clause th, .clause td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .clause a { color: var(--accent); }
  .clause hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .clause img { max-width: 100%; }

  .srclabel { font-size: 11px; color: var(--muted); margin: 0 0 4px; }
  .src {
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
    background: #f7f7f5; border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 10px; margin-bottom: 18px;
  }
  .crumb {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #6b6b64; background: #f1f1ee; border: 1px solid var(--line);
    border-bottom: none; border-radius: 5px 5px 0 0; padding: 6px 10px;
    word-break: break-word;
  }
  .crumb b { color: var(--text); font-weight: 600; }
  .crumb + .ctx { border-radius: 0 0 5px 5px; }
  /* context: heading-scoped window, code dropped; clause chars highlighted */
  .ctx {
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #f7f7f5; border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 0; margin-bottom: 18px; overflow-x: auto;
  }
  .ctx .ln { display: flex; }
  .ctx .ln.hit { box-shadow: inset 3px 0 0 #d9a62b; }
  .ctx .no {
    flex: 0 0 46px; text-align: right; padding-right: 10px; user-select: none;
    color: #b5b5ae; font-variant-numeric: tabular-nums;
  }
  .ctx .tx { flex: 1; white-space: pre-wrap; word-break: break-word; color: #44443f; padding-right: 10px; }
  .ctx .hl { background: #fceeb5; border-radius: 2px; color: var(--text); }
  .ctx .ln.elide .tx { color: #b5b5ae; font-style: italic; }
  .ref { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 22px; }
  .chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; border: 1px solid;
  }
  .chip.is-y { color: var(--yes); border-color: #bcdcc8; background: #eef7f1; }
  .chip.is-n { color: var(--no); border-color: #eccac5; background: #fbf0ee; }
  .chip.is-u { color: var(--muted); border-color: var(--line); background: #f4f4f2; }

  .q { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .btns { display: flex; gap: 10px; }
  button {
    font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: #c8c8c3; }
  button kbd {
    font: 11px ui-monospace, monospace; color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 7px;
  }
  button.on-y { background: var(--yes); border-color: var(--yes); color: #fff; }
  button.on-n { background: var(--no); border-color: var(--no); color: #fff; }
  button.on-y kbd, button.on-n kbd { color: rgba(255,255,255,.75); border-color: rgba(255,255,255,.4); }
  button.clear { margin-left: auto; font-weight: 400; color: var(--muted); }

  .rlabel { font-size: 11px; color: var(--muted); margin: 18px 0 4px; }
  #reason {
    width: 100%; min-height: 64px; resize: vertical;
    font: inherit; line-height: 1.5; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px;
  }
  #reason:focus { outline: none; border-color: var(--accent); }
  .rsaved { font-size: 11px; color: var(--muted); margin-top: 3px; min-height: 14px; }

  #err {
    background: var(--no); color: #fff; font-weight: 600;
    padding: 8px 16px; font-size: 13px;
  }
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 7px 16px; font-size: 12px; color: var(--muted);
  }
  footer kbd {
    font: 11px ui-monospace, monospace; border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px; background: var(--bg);
  }
</style>
</head>
<body>
<header>
  <h1>Is-rule annotator</h1>
  <div class="progress">
    <div class="bar"><i id="barfill"></i></div>
    <span id="prog">–</span>
  </div>
</header>

<div id="err" hidden></div>
<main>
  <div id="list"></div>
  <div id="detail"><div class="wrap" id="wrap"></div></div>
</main>

<footer>
  <kbd>↑</kbd> <kbd>↓</kbd> move &nbsp;·&nbsp; <kbd>y</kbd> yes &nbsp;·&nbsp; <kbd>n</kbd> no
  &nbsp;·&nbsp; <kbd>u</kbd> unset &nbsp;·&nbsp; <kbd>⏎</kbd> next clause
</footer>

<script src="vendor/marked.min.js"></script>
<script>
let CLAUSES = [], cur = 0;

const el = (id) => document.getElementById(id);

async function boot() {
  const r = await fetch('/api/clauses').then(r => r.json());
  CLAUSES = r.clauses;
  renderList();
  setStats(r.stats);
  // resume at the first unlabelled clause
  const next = CLAUSES.findIndex(c => c.human === null);
  select(next === -1 ? 0 : next);
}

function renderList() {
  el('list').innerHTML = CLAUSES.map(c => `
    <div class="item" data-i="${c.i}">
      <span class="dot ${dotClass(c.human)}"></span>
      <span class="n">${c.i + 1}</span>
      <span class="t">${esc(c.text.replace(/\s+/g, ' ').slice(0, 90))}</span>
    </div>`).join('');
  el('list').onclick = (e) => {
    const it = e.target.closest('.item');
    if (it) select(+it.dataset.i);
  };
}

// Clauses come from arbitrary public repos, so raw HTML inside one is shown as
// literal text rather than injected, and only http(s) links stay clickable.
marked.use({
  renderer: {
    html(token) { return esc(typeof token === 'string' ? token : token.raw); },
    link(token) {
      const href = typeof token === 'string' ? token : token.href;
      const text = typeof token === 'string' ? arguments[2] : token.text;
      if (!/^https?:\/\//i.test(href)) return esc(text || href);
      return `<a href="${esc(href)}" target="_blank" rel="noreferrer">${esc(text || href)}</a>`;
    }
  }
});

function md(src) {
  try {
    return marked.parse(src, { breaks: true, gfm: true });
  } catch (e) {
    return `<pre>${esc(src)}</pre>`;
  }
}

// Breadcrumb of enclosing headings; the innermost section is what usually
// decides the call ("## Use Cases" vs "## Safety Rules"), so it is emphasised.
function crumbHtml(c) {
  if (!c.heading_path) return '';
  const parts = c.heading_path.split(' > ');
  const last = parts.pop();
  return `<div class="crumb">${parts.map(esc).join(' › ')}${parts.length ? ' › ' : ''}<b>${esc(last)}</b></div>`;
}

// Link to the original file on GitHub, pinned to the clause's first line.
function originLink(c) {
  const o = c.origin;
  if (!o || !o.link) return '';
  let line = c.ctx_start_line || 1;
  if (c.context != null) {
    const pos = c.context.indexOf(c.text);
    if (pos !== -1) line += c.context.slice(0, pos).split('\n').length - 1;
  }
  const label = `${o.repo}/${o.path}`;
  return `<a href="${esc(o.link)}#L${line}" target="_blank" rel="noreferrer"
    title="${esc(label)}">${esc(label.length > 60 ? '…' + label.slice(-59) : label)}</a>`;
}

// Render the context block with line numbers, highlighting the clause's exact
// character span (located inside the context verbatim), not whole lines.
function ctxHtml(c) {
  const lines = c.context.split('\n');
  const pos = c.context.indexOf(c.text);
  const end = pos === -1 ? -1 : pos + c.text.length;
  const base = c.ctx_start_line || 1;
  let off = 0;
  return lines.map((t, i) => {
    const lo = off, hi = off + t.length;          // this line's span in the context
    off = hi + 1;                                 // +1 for the newline
    let tx, hit = false;
    if (pos !== -1 && pos < hi && end > lo) {     // clause overlaps this line
      hit = true;
      const a = Math.max(pos, lo) - lo, b = Math.min(end, hi) - lo;
      tx = esc(t.slice(0, a)) + `<span class="hl">${esc(t.slice(a, b))}</span>` + esc(t.slice(b));
    } else {
      tx = esc(t);
    }
    return `
    <div class="ln${hit ? ' hit' : ''}${t.trim() === '⋯' ? ' elide' : ''}">
      <span class="no">${base + i}</span><span class="tx">${tx || ' '}</span>
    </div>`;
  }).join('');
}

function saveFailed(msg) {
  const e = el('err'); e.textContent = '⚠ ' + msg; e.hidden = false;
}
function clearFailed() { el('err').hidden = true; }

function dotClass(human) {
  return human === true ? 'is-y' : human === false ? 'is-n' : '';
}

function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}

function select(i) {
  if (i < 0 || i >= CLAUSES.length) return;
  if (reasonDirty) flushReason(reasonDirty);      // don't lose a half-typed reason
  cur = i;
  document.querySelectorAll('.item.sel').forEach(n => n.classList.remove('sel'));
  const node = document.querySelector(`.item[data-i="${i}"]`);
  node.classList.add('sel');
  node.scrollIntoView({ block: 'nearest' });
  renderDetail();
}

function renderDetail() {
  const c = CLAUSES[cur];
  el('wrap').innerHTML = `
    <div class="meta">
      <span>${c.i + 1} of ${CLAUSES.length}</span>
      <code>${c.clause_id}</code>
      ${originLink(c)}
    </div>
    ${c.context != null ? `
      <p class="srclabel">context (heading-scoped, code omitted, clause highlighted)</p>
      ${crumbHtml(c)}<div class="ctx">${ctxHtml(c)}</div>`
    : `
      <p class="srclabel">source</p>
      <div class="src">${esc(c.text)}</div>`}
    <div class="ref">
      LLM judge (reference):
      ${c.llm === null
        ? `<span class="chip is-u">not run yet</span>`
        : `<span class="chip ${c.llm ? 'is-y' : 'is-n'}">${c.llm ? 'is a rule' : 'not a rule'}</span>`}
    </div>
    <div class="q">Is this a rule?</div>
    <div class="btns">
      <button id="by" class="${c.human === true ? 'on-y' : ''}">Yes <kbd>y</kbd></button>
      <button id="bn" class="${c.human === false ? 'on-n' : ''}">No <kbd>n</kbd></button>
      <button id="bu" class="clear">Unset <kbd>u</kbd></button>
    </div>
    <p class="rlabel">reason (optional — saved as you type)</p>
    <textarea id="reason"></textarea>
    <div class="rsaved" id="rsaved"></div>`;
  el('by').onclick = () => setLabel(true);
  el('bn').onclick = () => setLabel(false);
  el('bu').onclick = () => setLabel(null, false);
  const ta = el('reason');
  ta.value = c.reason || '';
  ta.oninput = () => queueReason(c);
  ta.onblur = () => flushReason(c);
}

// ---- reason persistence: debounced while typing, flushed on blur/navigation ----
let reasonTimer = null, reasonDirty = null;

function queueReason(c) {
  c.reason = el('reason').value;
  reasonDirty = c;
  clearTimeout(reasonTimer);
  reasonTimer = setTimeout(() => flushReason(c), 600);
}

async function flushReason(c) {
  clearTimeout(reasonTimer);
  if (reasonDirty !== c) return;
  reasonDirty = null;
  const res = await fetch('/api/label', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ clause_id: c.clause_id, reason: c.reason })
  }).then(r => r.json());
  const note = el('rsaved');
  if (note) note.textContent = res.ok ? 'saved' : 'save failed — retry by typing';
  if (note && res.ok) setTimeout(() => { if (note.textContent === 'saved') note.textContent = ''; }, 1200);
}

async function setLabel(human, advance = false) {   // advance is on Return, not on label
  const c = CLAUSES[cur];
  const prev = c.human;
  c.human = human;
  // paint immediately; the write is confirmed below
  const dot = document.querySelector(`.item[data-i="${c.i}"] .dot`);
  dot.className = 'dot ' + dotClass(human);
  renderDetail();

  let res;
  try {
    const r = await fetch('/api/label', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clause_id: c.clause_id, human })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    res = await r.json();
  } catch (e) {
    // The write did NOT land. Revert the optimistic paint and say so loudly,
    // rather than letting a dead server look like a saved label.
    c.human = prev;
    dot.className = 'dot ' + dotClass(prev);
    renderDetail();
    saveFailed('label not saved — server unreachable (' + e.message + ')');
    return;
  }
  clearFailed();
  if (res.stats) setStats(res.stats);

  if (advance && cur < CLAUSES.length - 1) select(cur + 1);
}

function setStats(s) {
  el('barfill').style.width = (100 * s.done / s.total) + '%';
  const hasLLM = CLAUSES.some(c => c.llm !== null);
  const pct = s.done ? Math.round(100 * s.agree / s.done) : 0;
  el('prog').textContent =
    `${s.done}/${s.total} labelled · ${s.yes} yes / ${s.no} no`
    + (hasLLM ? ` · ${pct}% agree with LLM` : '');
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Escape') e.target.blur();      // Esc leaves the reason box
    if (e.key === 'Enter' && !e.shiftKey) {       // Enter in the box = next clause
      e.preventDefault();
      e.target.blur();                            // blur flushes the reason
      select(cur + 1);
    }
    return;                                       // typing must not trigger y/n/u
  }
  const k = e.key.toLowerCase();
  if (e.key === 'Enter') { e.preventDefault(); select(cur + 1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); select(cur + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); select(cur - 1); }
  else if (k === 'y') { e.preventDefault(); setLabel(true); }
  else if (k === 'n') { e.preventDefault(); setLabel(false); }
  else if (k === 'u') { e.preventDefault(); setLabel(null, false); }
});

boot();
</script>
</body>
</html>
